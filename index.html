<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delivery Log System</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme color for browser toolbar -->
  <meta name="theme-color" content="#d60000" />
</head>

<body>

  <!-- 🚧 UNDER MAINTENANCE SCREEN 🚧 -->
  <div id="maintenance-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #111; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: Arial, sans-serif; text-align: center; padding: 20px; color: white;">
      <h1 style="font-size: 3rem; color: #d60000; margin-bottom: 10px;">🛠️ Under Maintenance</h1>
      <p style="font-size: 1.2rem; color: #ccc;">We are currently updating the Delivery Log System.</p>
      <p style="font-size: 1rem; color: #888;">Please check back later. Thank you for your patience!</p>
  </div>

  <!-- ⬇️ ANG IMONG ORIHINAL NGA APP (Gitagoan ni kung naka-maintenance) ⬇️ -->
  <div id="app-content" style="display: none;">

      <!-- Background video (focus lang ni, minimal) -->
      <video autoplay muted loop playsinline class="background-video">
        <source src="nico.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

      <!-- Existing container/content (unchanged) -->
      <div class="container">
          <h2>Delivery Log System</h2>
          <button class="btn-grab" onclick="location.href='grab.html'">Grab</button>
          <button class="btn-panda" onclick="location.href='panda.html'">FoodPanda</button>
          <button class="back-btn" onclick="location.href='admin-login.html'">Admin</button>
      </div>

  </div>

  <!-- PWA Install Button & Service Worker (unchanged) -->
  <script>
  // ==========================================
  // 🚧 MAINTENANCE SWITCH 🚧
  // ==========================================
  // true  = Naka-OFF ang app (Under Maintenance)
  // false = Naka-ON ang app (Makita ang Grab/FoodPanda/Admin)
  const IS_MAINTENANCE = true;

  if (IS_MAINTENANCE === true) {
      document.getElementById('maintenance-screen').style.display = 'flex';
      document.getElementById('app-content').style.display = 'none';
  } else {
      document.getElementById('maintenance-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
  }
  // ==========================================


  let deferredPrompt;
  const installBtn = document.createElement("button");
  installBtn.textContent = "Install App";
  installBtn.style.cssText = `
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 25px;
      font-size: 16px;
      background: #d60000;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 1000;
      display: none;
  `;
  document.body.appendChild(installBtn);

  window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Ayaw ipakita ang install button kung naka-maintenance
      if (IS_MAINTENANCE === false) {
          installBtn.style.display = "block";
      }
  });

  installBtn.addEventListener('click', async () => {
      installBtn.style.display = "none";
      if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
              console.log("User response to install:", choiceResult.outcome);
              deferredPrompt = null;
          });
      }
  });

  if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
          .then(() => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker registration failed:', err));
  }
  </script>

</body>
</html>
